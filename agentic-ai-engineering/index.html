<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table of Contents</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.container { max-width:800px; margin:0 auto; padding:48px 24px; }
h1 { font-size:2rem; margin-bottom:8px; }
.subtitle { color:var(--muted); margin-bottom:12px; }
.meta { display:flex; gap:16px; color:var(--muted); font-size:0.85rem; margin-bottom:40px; flex-wrap:wrap; }
.back { display:inline-block; margin-bottom:24px; color:var(--accent); text-decoration:none; font-size:0.9rem; }
.toc { display:flex; flex-direction:column; gap:2px; }
.toc a:hover { background:var(--card); }
footer { margin-top:48px; text-align:center; color:var(--muted); font-size:0.8rem; padding:24px 0; border-top:1px solid var(--border); }
footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="container">
  <a href="../" class="back">← All Books</a>
  <h1>📚 Table of Contents</h1>
  <p class="subtitle">Select a chapter to read</p>
  <div class="meta">
    <span>📖 0 Chapters</span>
    <span>✍️ Tri Doan</span>
    <span>📅 2026</span>
  </div>
  <div class="toc">

  </div>
</div>
<footer><a href="../">Back to Library</a></footer>
</body>
</html>
